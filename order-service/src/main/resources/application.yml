spring:
  application:
    name: order-service

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  cloud:
    openfeign:
      client:
        config:
          PRODUCT-SERVICE:
            connectTimeout: 2000
            readTimeout: 3000

server:
  port: 8083

logging:
  level:
    org.springframework: INFO
    com.kumar.orderservice: DEBUG
    io.github.resilience4j.retry: DEBUG
    io.github.resilience4j.circuitbreaker: DEBUG

resilience4j:
  retry:
    instances:
      productService:
        maxAttempts: 2
        waitDuration: 1s

  circuitbreaker:
    instances:
      productService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2

  ratelimiter:
    instances:
      orderService:
        limitForPeriod: 5
        limitRefreshPeriod: 60s
        timeoutDuration: 0s

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000